<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Il Buco · Cariló · Tour 3D</title>
<meta name="description" content="Il Buco, Cariló: recorré la casa en 3D, piso por piso, con video y fotos de cada lugar.">
<link rel="canonical" href="https://ilbuco.com.ar/3d">
<link rel="alternate" hreflang="es" href="https://ilbuco.com.ar/3d">
<link rel="alternate" hreflang="en" href="https://ilbuco.com.ar/en/3d">
<link rel="alternate" hreflang="pt" href="https://ilbuco.com.ar/pt/3d">
<link rel="alternate" hreflang="ru" href="https://ilbuco.com.ar/ru/3d">
<link rel="alternate" hreflang="x-default" href="https://ilbuco.com.ar/3d">
<meta property="og:title" content="Il Buco · Cariló · Tour 3D">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ilbuco.com.ar/3d">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dfe9ec;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#222;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{text-wrap:pretty}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.dot i{position:absolute;left:-9px;top:-9px;width:12px;height:12px;border-radius:50%;background:#ffd45c;border:3px solid #222;pointer-events:auto;cursor:pointer;box-sizing:content-box}
.dot i::after{content:"";position:absolute;inset:-10px}
.dot .tip{display:none;position:absolute;left:0;bottom:16px;transform:translateX(-50%);background:#fff;border:2px solid #222;border-radius:8px;padding:4px 8px;white-space:nowrap;font-size:14px;line-height:1.25;box-shadow:0 2px 0 #222;z-index:5}
.dot .tip b{display:block;font-size:14px}
.dot .tip span{display:block;font-size:13px;color:#222}
.dot:hover{z-index:9}.dot:hover .tip,.dot.open .tip{display:block}
.dot:hover i,.dot.open i{background:#fff}
.dot.txt i{display:none}.dot.txt .tip{display:block;bottom:auto;top:0;transform:translate(-50%,-50%);box-shadow:none;font-weight:600}
.nodots .dot:not(.cam){display:none!important}
.dot.cam i{background:#4aa3ff;width:14px;height:14px;left:-10px;top:-10px}
.dot.cam:hover i,.dot.cam.on i{background:#fff}
.nocams .dot.cam{display:none!important}
#nav{position:fixed;left:10px;top:10px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border:2px solid #222;border-radius:12px;padding:6px;box-sizing:border-box;width:210px;font-size:15px;touch-action:pan-y;z-index:10}
#nav ul{list-style:none;margin:0;padding:0}
#nav ul ul{margin:2px 0 4px 12px;border-left:2px solid #ddd;padding-left:6px}
#nav button{display:block;width:100%;text-align:left;font:inherit;color:#222;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;line-height:1.2}
#nav button:hover{background:#f1f1ee}
#nav button.path{font-weight:700}
#nav button.on{background:#222;color:#fff;font-weight:700}
#nav .opts{display:flex;flex-wrap:wrap;gap:8px 12px;border-top:2px solid #eee;margin-top:6px;padding:8px 6px 2px;font-size:14px}
#nav .opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
#nav .opts input{width:18px;height:18px;margin:0;accent-color:#222}
#nav #navt{display:none}
#nav #home{display:block;padding:6px 8px 8px;font-size:20px;font-weight:700;letter-spacing:-.025em;color:#222;text-decoration:none}
#nav #home:hover{color:#1d4ed8}
#photo{display:none;position:fixed;right:10px;top:10px;bottom:10px;width:min(500px,40vw);background:#fff;border:2px solid #222;border-radius:12px;padding:10px;box-sizing:border-box;flex-direction:column;gap:8px;overflow:auto;z-index:20;touch-action:pan-y}
#photo.show{display:flex}
#photo video{width:100%;aspect-ratio:16/9;background:#111;border-radius:8px;flex:none}
#photo .cap{font-weight:700;font-size:16px;padding-right:38px}
#photo img.big{width:100%;max-height:46vh;object-fit:contain;background:#eee;border-radius:8px;flex:none}
#photo .use{font-size:14px;line-height:1.4;color:#222}
#photo .th{display:flex;gap:6px;flex-wrap:wrap}
#photo .th img{height:56px;border-radius:6px;border:2px solid transparent;cursor:pointer}
#photo .th img.on{border-color:#222}
#photo .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border:2px solid #222;background:#ffd45c;border-radius:8px;font-size:18px;cursor:pointer;padding:0;color:#222}
#photo .cap{order:-1}
@media(max-width:700px){
  #nav{width:auto;min-width:0;max-width:62vw;font-size:14px;padding:4px;max-height:calc(100% - 20px)}
  #nav button{padding:5px 7px}
  #nav ul ul{margin-left:8px;padding-left:5px}
  #nav.fold>ul,#nav.fold .opts,#nav.fold #home{display:none}
  #nav #navt{display:block;font-weight:700}
  #photo{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:56vh}
  #photo img.big{max-height:26vh}
}
</style></head><body>
<div id="stage"></div><div id="labels"></div>
<nav id="nav"><button id="navt"></button><a id="home" href="/">IL BUCO</a><ul id="navl"></ul>
<div class="opts"><label><input type="checkbox" id="second" checked>Nombres</label><label><input type="checkbox" id="fotos" checked>Video y fotos</label><label><input type="checkbox" id="plan">Planta</label></div></nav>
<div id="photo"><button class="x" aria-label="Cerrar">×</button><video muted playsinline controls preload="none"></video><div class="cap"></div><img class="big" alt=""><div class="use"></div><div class="th"></div></div>
<script>
// щипок двумя пальцами — только для 3D: страница не масштабируется и не сдвигается
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#nav,#photo')) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
